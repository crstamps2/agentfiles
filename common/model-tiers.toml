# Tier -> concrete model per tool. Single source of truth; edit here to change all tools.
#
# Keys per table:
#   claude       -- Claude Code model name
#   codex_model  -- Codex CLI model name
#   codex_effort -- Codex CLI reasoning effort
#   pi_model     -- pi model pattern (see `pi --list-models`); accepts `provider/id` too
#   pi_thinking  -- pi thinking level: off|minimal|low|medium|high|xhigh|max
#
# pi composes model + thinking as `pi_model:pi_thinking` (e.g. `opus:high`) when it
# needs a single string (agent frontmatter `model:`), and uses them separately for
# the orchestrator's settings.json (defaultModel / defaultThinkingLevel).
[orchestrator]
claude = "opus"
codex_model = "gpt-5.5"
codex_effort = "high"
pi_model = "failover/sol"              # Codex-first interactive default; Claude Opus 5.5 only on provider outage
pi_thinking = "high"

[specialist]
claude = "sonnet"
codex_model = "gpt-5.4"
codex_effort = "medium"
pi_model = "openai/gpt-5.6-terra"
pi_thinking = "xhigh"

[specialist-execution]
claude = "sonnet"
codex_model = "gpt-5.4"
codex_effort = "high"
pi_model = "openai/gpt-5.6-terra"
pi_thinking = "max"

[specialist-fast]
claude = "sonnet"
codex_model = "gpt-5.4-mini"
codex_effort = "high"
pi_model = "openai/gpt-6-luna"
pi_thinking = "medium"

[data-fetch]
claude = "haiku"
codex_model = "gpt-5.4-mini"
codex_effort = "low"
pi_model = "openai/gpt-6-luna"
pi_thinking = "low"

# --- Agent-loop tiers (ZIP-6774 pilot). Worker model IDs are verified in slice 1
# (see docs/superpowers/plans/2026-09-10-agent-loop-1-runner-core.md, Task 14). ---
[worker-cloud]
claude = "sonnet"                    # workers are pi-only; other tools get a sane default
codex_model = "gpt-5.4-mini"
codex_effort = "medium"
pi_model = "openai/gpt-5.6-terra"   # Codex-first cloud worker; Claude Sonnet 5.5 is its provider-outage fallback
pi_thinking = "low"

[worker-small]
claude = "haiku"
codex_model = "gpt-6-luna"
codex_effort = "low"
pi_model = "openai/gpt-6-luna"   # truly small tasks (size = "small"); Claude Haiku 4.5 on Codex outage
pi_thinking = "low"

[worker-premium]
claude = "sonnet"
codex_model = "gpt-5.4"
codex_effort = "high"
pi_model = "openai/gpt-5.6-terra"
pi_thinking = "max"

[flagship-author]
claude = "opus"
codex_model = "gpt-5.5"
codex_effort = "high"
pi_model = "openai/gpt-5.6-sol"   # Codex-first plan author; Claude Opus 5.5 is its provider-outage fallback
pi_thinking = "medium"

[flagship-critic]
claude = "opus"
codex_model = "gpt-5.5"
codex_effort = "high"
pi_model = "anthropic/claude-fable-5-1"   # opposite-vendor plan critic; Astra is its provider-outage fallback
pi_thinking = "high"

[task-writer]
claude = "sonnet"
codex_model = "gpt-5.4-mini"
codex_effort = "medium"
pi_model = "openai/gpt-5.6-terra"  # field guide tier 2: turns a critic finding into a precise manifest edit; never a full re-plan
pi_thinking = "medium"

[repair-agent]
claude = "opus"
codex_model = "gpt-5.5"
codex_effort = "high"
pi_model = "openai/gpt-5.6-terra"   # fixes runner defects test-first in a throwaway worktree (repair.py)
pi_thinking = "max"

[repair-reviewer]
claude = "opus"
codex_model = "gpt-5.5"
codex_effort = "high"
pi_model = "anthropic/claude-opus-5-5"    # opposite-vendor reviewer for unattended Terra repairs
pi_thinking = "high"
