# Tier -> concrete model per tool. Single source of truth; edit here to change all tools.
#
# Keys per table:
#   claude       -- Claude Code model name
#   codex_model  -- Codex CLI model name
#   codex_effort -- Codex CLI reasoning effort
#   pi_model     -- pi model pattern (see `pi --list-models`); accepts `provider/id` too
#   pi_thinking  -- pi thinking level: off|minimal|low|medium|high|xhigh|max
#
# pi composes model + thinking as `pi_model:pi_thinking` (e.g. `opus:high`) when it
# needs a single string (agent frontmatter `model:`), and uses them separately for
# the orchestrator's settings.json (defaultModel / defaultThinkingLevel).
[orchestrator]
claude = "opus"
codex_model = "gpt-5.5"
codex_effort = "high"
pi_model = "opus"
pi_thinking = "medium"

[specialist]
claude = "sonnet"
codex_model = "gpt-5.4"
codex_effort = "medium"
pi_model = "sonnet"
pi_thinking = "medium"

[specialist-fast]
claude = "sonnet"
codex_model = "gpt-5.4-mini"
codex_effort = "high"
pi_model = "sonnet"
pi_thinking = "medium"

[data-fetch]
claude = "haiku"
codex_model = "gpt-5.4-mini"
codex_effort = "low"
pi_model = "haiku"
pi_thinking = "low"

# --- Agent-loop tiers (ZIP-6774 pilot). Worker model IDs are verified in slice 1
# (see docs/superpowers/plans/2026-09-10-agent-loop-1-runner-core.md, Task 14). ---
[worker-cloud]
claude = "sonnet"                    # workers are pi-only; other tools get a sane default
codex_model = "gpt-5.4-mini"
codex_effort = "medium"
pi_model = "ollama-cloud/gpt-oss:20b"   # Free-plan starter set; deepseek/glm are 402 without credits
pi_thinking = "medium"

[worker-local]
claude = "sonnet"
codex_model = "gpt-5.4-mini"
codex_effort = "medium"
pi_model = "ollama-local/gpt-oss-ctx32k:20b"   # ctx-pinned derived model; stock 4K ctx truncates pi's system prompt
pi_thinking = "medium"

[worker-premium]
claude = "sonnet"
codex_model = "gpt-5.4"
codex_effort = "high"
pi_model = "openai-codex/gpt-5.6-terra"
pi_thinking = "max"

[flagship-author]
claude = "opus"
codex_model = "gpt-5.5"
codex_effort = "high"
pi_model = "anthropic/claude-fable-5-1"
pi_thinking = "medium"

[flagship-critic]
claude = "opus"
codex_model = "gpt-5.5"
codex_effort = "high"
pi_model = "openai-codex/gpt-6-astra"
pi_thinking = "high"
