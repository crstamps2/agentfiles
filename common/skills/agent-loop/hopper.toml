# Agent loop configuration. Source of truth for what the runner may touch.
# Retrieval-dated values are labeled; re-check them when they age.

[hopper]
epic = "ZIP-6774"
owned_epics = ["ZIP-6774", "ZIP-6775", "ZIP-6776", "ZIP-6777", "ZIP-6778", "ZIP-6779", "ZIP-6780", "ZIP-6781"]   # cmux listener skips children of these; must include every [drip].epics entry

# Dependency graph. Order here is also the tie-break order.
# The hopper is now a DRIP fed from Jira (runner.py drip): children of the epic, board Rank order
# (top first), any assignee, skipping tickets excluded below or whose `deps` are not Done in Jira.
# Tickets listed here are only for overrides: `deps` (dependency edges the board cannot express),
# `pin_arm`, or `exclude = true` with a reason. Anything not listed inherits defaults.
[[hopper.tickets]]
key = "ZIP-4281"   # Nav Tabs
deps = ["ZIP-7872"]
[[hopper.tickets]]
key = "ZIP-4282"   # Nav Pills
deps = ["ZIP-7872"]
[[hopper.tickets]]
key = "ZIP-4293"   # Section
exclude = "Martin's epic audit (comment 87183): purpose unclear (❓)"
[[hopper.tickets]]
key = "ZIP-7876"   # Card Spotlight
exclude = "Martin's epic audit (comment 87183): deprecated (❌)"
[[hopper.tickets]]
key = "ZIP-7873"   # Well
exclude = "Martin's epic audit: replace with Card secondary; PR #47894 at Human Gate 1 pending Cody's decision"

[drip]
epics = ["ZIP-6774", "ZIP-6775", "ZIP-6776", "ZIP-6777", "ZIP-6778", "ZIP-6779", "ZIP-6780", "ZIP-6781"]   # ZUI phases 3-10, drained in this order (Cody 2026-10-07)
max_in_flight = 4            # run 4 at a time (Cody 2026-10-08); 7 is the hard cap, enforced in config.py and drip.py
issue_types = ["Story", "Task", "Bug"]
skip_assigned_to_others = false   # Cody: "assigned to me or not" -- but ONLY tickets in the ready column (Selected for Work); In Progress = a person owns it
jql_extra = ""               # appended to the epic JQL if needed

[paths]
state_root = "~/.local/state/agent-loop"
cmux_chain_dir = "~/.claude/skills/spinup/scripts"     # LIVE copy (dotfiles), not common/
pi_agents_dir = "~/.pi/agent/agents"

[timeouts]
heavy_stage_s = 4500        # 75 min, per field guide; calibrate in slice 4
light_stage_s = 1800

[admission]
compressor_pct_max = 60.0    # SECONDARY signal. On Apple silicon the kernel compresses cold pages proactively, so
                             # 30-45% is a normal daytime steady state (macOS memory_pressure says 'normal' at 35%).
                             # `pressure_level` (memory_pressure warn/critical) is the primary memory gate; this
                             # ceiling only catches a runaway. Slice-1 idle baseline was 20-26%.
load_per_core_max = 2.0     # SECONDARY. macOS runs mediaanalysisd/Spotlight when the box looks idle at night;
                            # first overnight run saw load 9-14 on 10 cores from the OS alone with memory_pressure
                            # 'normal'. 1.0 would have waited until dawn. pressure_level is the primary gate.
disk_free_gb_min = 20.0
require_ac_power = true
defer_max_s = 1800

[budgets]                    # USD; premium + total ENFORCE, others alert (Plan 2 wires alerts)
preimplementation_usd = 30.0   # a ticket that has spent this much with NO accepted task stops for an owner ruling
premium_daily_usd = 5.0
premium_monthly_usd = 40.0
total_unattended_daily_usd = 15.0
ci_rerun_max = 5

[protection]
# Never editable by workers, regardless of allowed_files.
protected_paths = ["bin/", ".github/", ".circleci/", "AGENTS.md", "CLAUDE.md", "config/ci/"]
# Editable only when the task manifest sets may_edit_tests = true.
test_path_globs = ["test/**", "spec/**", "**/fixtures/**", "**/__snapshots__/**"]
# Written by the agent harness / editor tooling INTO the worktree, never by a worker as code.
# Exempt from the allowlist exactly like gitignored build artifacts (protected paths still win).
# First real run (2026-09-11): pi wrote .pi/loops/*.json; ruby-lsp wrote .ruby-lsp/*.
harness_artifact_globs = [".pi/**", ".ruby-lsp/**", ".claude/**", ".codex/**", ".pi-subagents/**"]

[arms]
workers_parallel = 4        # MACHINE-WIDE worker slots (light: remote inference + edits). One per in-flight ticket; verification is still one-at-a-time on the heavy lane.
# Cheap arms alternate by task index unless a ticket pins one.
alternate = ["cloud", "cloud"]   # "cloud" arm = anthropic/claude-sonnet-5-5 (Ollama Cloud disallowed by security). size = "small" tasks start on small-worker (Haiku), see ladder.

[outcomes]
# Pre-registered before the first real run; the dashboard shows these verbatim.
primary = "first-attempt acceptance rate per arm (cloud, small, premium)"
secondary = ["wall time per accepted task per arm", "escalation rate per arm", "estimated cost per accepted ticket", "human-wait time per approval class"]
